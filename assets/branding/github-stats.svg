<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    :root {
      --bg-card: #EFEBE2;
      --ink: #211F1C;
      --ink-soft: #57534C;
      --muted: #9C958A;
      --line: #DDD6C7;
      --accent: #B54A2C;
      --accent-soft: rgba(181, 74, 44, 0.15);
      --graph-line: #B54A2C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card: #161b22;
        --ink: #EAEFF8;
        --ink-soft: #A3B3CA;
        --muted: #7E8C9F;
        --line: #30363D;
        --accent: #E56A47;
        --accent-soft: rgba(229, 106, 71, 0.15);
        --graph-line: #E56A47;
      }
    }
    
    @keyframes drawPath {
      from { stroke-dashoffset: 900; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes areaFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes barSlideIn {
      from { width: 0; }
      to { width: var(--final-w); }
    }
    @keyframes statFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pointExpand {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card {
      fill: var(--bg-card);
      stroke: var(--line);
      stroke-width: 1;
      rx: 6px;
    }
    .text-title {
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      font-size: 20px;
      font-weight: normal;
      fill: var(--ink);
    }
    .text-subtitle {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      fill: var(--muted);
    }
    .text-stat-num {
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      font-size: 38px;
      fill: var(--accent);
    }
    .text-stat-lbl {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: var(--ink-soft);
    }
    .progress-track {
      fill: var(--line);
      rx: 2px;
    }
    .progress-bar {
      fill: var(--accent);
      rx: 2px;
      animation: barSlideIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .chart-line {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: drawPath 3s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }
    .chart-area {
      animation: areaFade 2s ease-out 1.8s forwards;
      opacity: 0;
    }
    .chart-grid {
      stroke: var(--line);
      stroke-width: 1;
      opacity: 0.5;
    }
    .chart-label {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: var(--muted);
      text-anchor: middle;
    }
    
    .animate-item {
      opacity: 0;
      animation: statFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pt {
      transform-origin: center;
      animation: pointExpand 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>

  <!-- LEFT CARD: PROFILE SUMMARY -->
  <g transform="translate(64, 10)">
    <rect class="card" width="380" height="280"/>
    
    <!-- Header -->
    <g class="animate-item" style="animation-delay: 0.2s;">
      <text x="30" y="45" class="text-title">Praveen Amujuri</text>
      <text x="30" y="65" class="text-subtitle">GITHUB PROFILE SUMMARY</text>
    </g>

    <!-- Stat 1: Contributions -->
    <g class="animate-item" style="animation-delay: 0.4s;">
      <text x="30" y="125" class="text-stat-num">348</text>
      <text x="30" y="145" class="text-stat-lbl">Contributions in 2026</text>
      <rect class="progress-track" x="30" y="155" width="320" height="4"/>
      <rect class="progress-bar" x="30" y="155" height="4" style="--final-w: 240px; animation-delay: 0.6s;"/>
    </g>

    <!-- Stat 2: Repos -->
    <g class="animate-item" style="animation-delay: 0.6s;">
      <text x="30" y="205" class="text-stat-num">32</text>
      <text x="30" y="225" class="text-stat-lbl">Public Repositories</text>
      <rect class="progress-track" x="30" y="235" width="320" height="4"/>
      <rect class="progress-bar" x="30" y="235" height="4" style="--final-w: 160px; animation-delay: 0.8s;"/>
    </g>

    <!-- Footer info -->
    <text x="30" y="260" class="text-stat-lbl animate-item" style="animation-delay: 0.8s; opacity: 0.6;">Joined GitHub 1 year ago</text>
  </g>

  <!-- RIGHT CARD: CONTRIBUTION ACTIVITY GRAPH -->
  <g transform="translate(464, 10)">
    <rect class="card" width="472" height="280"/>
    
    <!-- Title -->
    <g class="animate-item" style="animation-delay: 0.3s;">
      <text x="30" y="45" class="text-title">Activity Graph</text>
      <text x="30" y="65" class="text-subtitle">CONTRIBUTIONS OVER THE LAST YEAR</text>
    </g>

    <!-- Grid lines -->
    <g class="chart-grid">
      <line x1="40" y1="110" x2="430" y2="110" />
      <line x1="40" y1="160" x2="430" y2="160" />
      <line x1="40" y1="210" x2="430" y2="210" />
    </g>

    <!-- Chart Path and Area -->
    <!-- Coordinate Points mapping dates:
         x coords: 25/06 (60), 25/08 (120), 25/10 (180), 25/12 (240), 26/02 (300), 26/04 (360), 26/06 (420)
         y coords: mapped to contribution scale (base y=210, peak y=90)
    -->
    <path class="chart-area" d="M 60 210 L 60 170 Q 90 140 120 180 T 180 130 T 240 160 T 300 110 T 360 150 T 420 90 L 420 210 Z" fill="url(#areaGrad)"/>
    <path class="chart-line" d="M 60 170 Q 90 140 120 180 T 180 130 T 240 160 T 300 110 T 360 150 T 420 90" fill="none" stroke="var(--graph-line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data points (pulsing/expanding nodes) -->
    <circle class="pt" cx="60" cy="170" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 60px 170px; animation-delay: 1.4s;"/>
    <circle class="pt" cx="120" cy="180" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 120px 180px; animation-delay: 1.6s;"/>
    <circle class="pt" cx="180" cy="130" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 180px 130px; animation-delay: 1.8s;"/>
    <circle class="pt" cx="240" cy="160" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 240px 160px; animation-delay: 2.0s;"/>
    <circle class="pt" cx="300" cy="110" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 300px 110px; animation-delay: 2.2s;"/>
    <circle class="pt" cx="360" cy="150" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 360px 150px; animation-delay: 2.4s;"/>
    <circle class="pt" cx="420" cy="90" r="4" fill="var(--bg-card)" stroke="var(--graph-line)" stroke-width="2" style="transform-origin: 420px 90px; animation-delay: 2.6s;"/>

    <!-- Labels for X Axis -->
    <text x="60" y="235" class="chart-label animate-item" style="animation-delay: 1.0s;">25/06</text>
    <text x="120" y="235" class="chart-label animate-item" style="animation-delay: 1.1s;">25/08</text>
    <text x="180" y="235" class="chart-label animate-item" style="animation-delay: 1.2s;">25/10</text>
    <text x="240" y="235" class="chart-label animate-item" style="animation-delay: 1.3s;">25/12</text>
    <text x="300" y="235" class="chart-label animate-item" style="animation-delay: 1.4s;">26/02</text>
    <text x="360" y="235" class="chart-label animate-item" style="animation-delay: 1.5s;">26/04</text>
    <text x="420" y="235" class="chart-label animate-item" style="animation-delay: 1.6s;">26/06</text>
  </g>

  <!-- Gradients definition -->
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--graph-line)" stop-opacity="0.25" />
      <stop offset="100%" stop-color="var(--graph-line)" stop-opacity="0.0" />
    </linearGradient>
  </defs>
</svg>
