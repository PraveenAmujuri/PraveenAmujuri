<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>
    :root {
      --ink: #211F1C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #EAEFF8;
      }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .icon-breathe {
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes dbBreathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .db-layer-1, .db-layer-2 { animation: dbBreathe 3.5s ease-in-out infinite; }
    .db-layer-2 { animation-delay: 0.7s; }
  
  </style>
  <ellipse cx="14" cy="7.5" rx="9" ry="3"/>
  <path class="db-layer-1" d="M5 7.5 V20.5 C5 22.2 9 23.5 14 23.5 C19 23.5 23 22.2 23 20.5 V7.5"/>
  <path class="db-layer-2" d="M5 14 C5 15.7 9 17 14 17 C19 17 23 15.7 23 14"/>
</svg>
