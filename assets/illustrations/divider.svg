<svg width="1000" height="40" viewBox="0 0 1000 40" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    :root {
      --muted: #9C958A;
      --accent: #B54A2C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --muted: #7E8C9F;
        --accent: #E56A47;
      }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.6); opacity: 1; }
    }
    @keyframes slideRight {
      0% { x: -80px; }
      100% { x: 1000px; }
    }
    .div-line {
      stroke: var(--muted);
      opacity: 0.35;
    }
    .scanner {
      animation: slideRight 3s linear infinite;
    }
    .div-dot {
      transform-origin: 64px 20px;
      animation: pulseDot 2s ease-in-out infinite;
    }
  </style>
  <line class="div-line" x1="64" y1="20" x2="1000" y2="20" stroke-width="1"/>
  <rect class="scanner" width="80" height="1" y="19.5" fill="url(#laserGradient)" />
  <circle class="div-dot" cx="64" cy="20" r="2.5" fill="var(--accent)"/>
  
  <defs>
    <linearGradient id="laserGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0" />
      <stop offset="50%" stop-color="var(--accent)" stop-opacity="1" />
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
